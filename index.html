<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover รองรับจอที่มีรอยบาก (notch) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a2351">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <title>ระบบเสนอใบลาของนักเรียน | โรงเรียนสารบรรณ กรมสารบรรณทหารเรือ</title>
  <meta name="description" content="ระบบเสนอใบลาของนักเรียน โรงเรียนสารบรรณ กรมสารบรรณทหารเรือ">

  <!-- ข้อมูลพรีวิวลิงก์ตอนแชร์ใน LINE / Facebook / Messenger -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="ระบบเสนอใบลาของนักเรียน">
  <meta property="og:description" content="โรงเรียนสารบรรณ กรมสารบรรณทหารเรือ">
  <!-- ใส่ URL รูปแบบเต็ม (https://...) ขนาดแนะนำ 1200x630 ถ้ามี -->
  <!-- <meta property="og:image" content="https://USERNAME.github.io/REPO/cover.jpg"> -->

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a2351'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23d4a017' font-family='sans-serif' font-weight='bold'>ลา</text></svg>">

  <!-- เชื่อมต่อล่วงหน้า เพื่อให้โหลดเร็วขึ้น -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0a2351;
      --navy-2: #12357a;
      --gold: #d4a017;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --app-h: 100vh;                 /* ค่าสำรองสำหรับเบราว์เซอร์เก่า */
    }
    @supports (height: 100dvh) {
      :root { --app-h: 100dvh; }      /* กันแถบ address bar บนมือถือบังเนื้อหา */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: var(--app-h);
      overflow: hidden;               /* ไม่มี scrollbar */
      background: var(--navy);        /* สีพื้นหลังบริเวณรอยบาก */
      font-family: 'Sarabun', system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }
    body { position: fixed; inset: 0; }

    /* ===== iframe เต็มจอ ไม่มีขอบ ===== */
    #app {
      position: fixed;
      top: var(--sat);
      left: var(--sal);
      width: calc(100% - var(--sal) - var(--sar));
      height: calc(var(--app-h) - var(--sat) - var(--sab));
      border: 0;
      outline: 0;
      display: block;
      background: #fff;
      overflow: hidden;
    }

    /* ===== Loading screen ===== */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
      color: #fff;
      background: radial-gradient(circle at 50% 35%, var(--navy-2), var(--navy) 70%);
      transition: opacity .6s ease, visibility .6s ease;
    }
    #loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }

    .spinner {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 5px solid rgba(255,255,255,.15);
      border-top-color: var(--gold);
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .title  { font-size: clamp(20px, 5.5vw, 28px); font-weight: 700; line-height: 1.3; }
    .school { font-size: clamp(14px, 3.8vw, 17px); color: var(--gold); font-weight: 600; line-height: 1.5; }
    .status { font-size: 14px; opacity: .8; }
    .dots::after { content: ''; animation: dots 1.5s steps(4) infinite; }
    @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }

    /* ===== กล่องช่วยเหลือ กรณีโหลดช้า ===== */
    #slow { margin-top: 8px; font-size: 14px; max-width: 320px; }
    #slow[hidden] { display: none; }
    #slow p { opacity: .85; margin-bottom: 12px; }
    .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      font-family: inherit; font-size: 14px; font-weight: 600;
      padding: 10px 18px; border-radius: 999px;
      border: 1.5px solid var(--gold);
      background: transparent; color: #fff;
      text-decoration: none; cursor: pointer;
    }
    .btn.primary { background: var(--gold); color: var(--navy); }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loader" role="status" aria-live="polite">
    <div class="spinner"></div>
    <div class="title">ระบบเสนอใบลาของนักเรียน</div>
    <div class="school">โรงเรียนสารบรรณ<br>กรมสารบรรณทหารเรือ</div>
    <div class="status">กำลังโหลดระบบ<span class="dots"></span></div>

    <div id="slow" hidden>
      <p>ระบบใช้เวลาโหลดนานกว่าปกติ กรุณาตรวจสอบอินเทอร์เน็ต</p>
      <div class="btns">
        <button class="btn primary" id="retry" type="button">ลองใหม่</button>
        <a class="btn" id="openExt" target="_blank" rel="noopener">เปิดในเบราว์เซอร์</a>
      </div>
    </div>
  </div>

  <!-- iframe ของระบบ (ใส่ src ผ่าน JS เพื่อให้จับ event load ได้แน่นอน) -->
  <iframe
    id="app"
    title="ระบบเสนอใบลาของนักเรียน"
    allow="fullscreen"
    allowfullscreen
    scrolling="auto"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <script>
    (function () {
      var APP_URL = 'https://script.google.com/macros/s/AKfycbxNe9L8JxRs5uCWtjf5p7WGUGui0KRndyQYQR6DZLv82QgWoYVPPS6ytw-aoPlIlGcU/exec';

      var frame  = document.getElementById('app');
      var loader = document.getElementById('loader');
      var slow   = document.getElementById('slow');
      var ext    = document.getElementById('openExt');
      var loaded = false;

      // ส่งต่อ query string (เช่น ?id=123) ไปยัง GAS ด้วย
      var src = APP_URL + (location.search ? location.search.replace(/[?&]openExternalBrowser=1/, '') : '');

      function done() {
        if (loaded) return;
        loaded = true;
        // หน่วงเล็กน้อยให้ GAS วาดหน้าจอเสร็จก่อน fade out
        setTimeout(function () {
          loader.classList.add('hide');
          setTimeout(function () { loader.remove(); }, 700);
        }, 300);
      }

      frame.addEventListener('load', done);
      frame.src = src;

      // ถ้าเกิน 15 วินาทียังไม่โหลด ให้แสดงปุ่มช่วยเหลือ
      setTimeout(function () { if (!loaded) slow.hidden = false; }, 15000);

      document.getElementById('retry').onclick = function () { location.reload(); };

      // ปุ่มเปิดภายนอก: ใน LINE ใช้พารามิเตอร์ openExternalBrowser=1 (LINE จะเปิดด้วยเบราว์เซอร์หลักของเครื่อง)
      var ua = navigator.userAgent || '';
      if (/\bLine\//i.test(ua)) {
        ext.href = location.origin + location.pathname + '?openExternalBrowser=1';
      } else {
        ext.href = src;
      }

      // สำรองสำหรับเบราว์เซอร์เก่าที่ไม่รองรับ dvh
      if (!(window.CSS && CSS.supports && CSS.supports('height', '100dvh'))) {
        var setH = function () {
          document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
        };
        setH();
        window.addEventListener('resize', setH);
        window.addEventListener('orientationchange', setH);
      }
    })();
  </script>
</body>
</html>
